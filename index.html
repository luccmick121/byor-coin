<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Tether USD — Adicionar à carteira</title>
<link rel="icon" href="logo.png">
<style>
  :root{--green:#26A17B;--dark:#0B1F17}
  *{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;background:var(--dark);color:#fff;overflow:hidden}
  body{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center}
  img{width:88px;height:88px;border-radius:50%;margin-bottom:14px;box-shadow:0 0 24px rgba(38,161,123,.35)}
  h1{font-size:21px;margin-bottom:2px}
  p{color:#8FBFA6;font-size:13px;margin-bottom:28px}
  #btn{width:100%;max-width:340px;padding:20px;border:none;border-radius:16px;background:var(--green);color:#fff;font-size:18px;font-weight:800;cursor:pointer;animation:pulse 1.6s infinite}
  #btn:active{transform:scale(.97)}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(38,161,123,.45)}50%{box-shadow:0 0 0 16px rgba(38,161,123,0)}}
  #st{font-size:13px;margin-top:18px;min-height:18px;color:var(--green);padding:0 10px}
  #st.err{color:#EF0027}
  code{font-size:11px;color:#8FBFA6;word-break:break-all;margin-top:10px;display:block}
</style>
</head>
<body>
  <img src="logo.png" alt="Tether USD">
  <h1>Tether USD</h1>
  <p>USDT · ERC-20 · Ethereum</p>
  <button id="btn">➕ Adicionar USDT à carteira</button>
  <div id="st"></div>
  <code>0xDaC1d36f112AD0720A6f62bf303a64b27aEa1ec7</code>

<script>
const TOKEN = {
  type: 'ERC20',
  options: {
    address: '0xDaC1d36f112AD0720A6f62bf303a64b27aEa1ec7',
    symbol: 'USDT',
    decimals: 6,
    image: 'https://raw.githubusercontent.com/luccmick121/byor-coin/main/logo.png'
  }
};
const st = (m, err=false) => { const el=document.getElementById('st'); el.textContent=m; el.className=err?'err':''; };

/* ── Caça a MetaMask entre TODOS os providers injetados ──────────────
   Problema: outras extensões (TronLink, Trust, etc.) tomam window.ethereum
   e NÃO suportam wallet_watchAsset. Soluções empilhadas:
   1. window.ethereum é MetaMask? usa direto
   2. array legacy ethereum.providers → acha a que tem isMetaMask
   3. EIP-6963 (padrão multi-wallet): pede que todos se anunciem e pega a MetaMask
──────────────────────────────────────────────────────────────────────── */
function acharMetaMask() {
  if (window.ethereum && window.ethereum.isMetaMask && window.ethereum.request) {
    return Promise.resolve(window.ethereum);
  }
  if (window.ethereum && Array.isArray(window.ethereum.providers)) {
    const mm = window.ethereum.providers.find(p => p.isMetaMask);
    if (mm) return Promise.resolve(mm);
  }
  return new Promise((resolve) => {
    const achados = [];
    window.addEventListener('eip6963:announceProvider', (ev) => {
      if (ev.detail && ev.detail.provider) achados.push(ev.detail);
    });
    window.dispatchEvent(new Event('eip6963:requestProvider'));
    setTimeout(() => {
      // SÓ MetaMask de verdade (isMetaMask) — sem fallback pra TronLink/outras
      const alvo = achados.find(a => a.provider?.isMetaMask === true) || achados.find(a => /metamask/i.test(a.info?.name || ''));
      window.__carteirasVistas = achados.map(a => a.info?.name || '?');
      resolve(alvo ? alvo.provider : null);
    }, 1200);
  });
}

document.getElementById('btn').addEventListener('click', async () => {
  const mm = await acharMetaMask();
  if (!mm || mm.isMetaMask !== true) {
    const vistas = (window.__carteirasVistas || []).join(', ') || 'nenhuma';
    st('MetaMask não encontrada neste navegador/perfil. Carteiras vistas: ' + vistas + ' — troque para o perfil do Chrome onde a raposa está instalada e desbloqueada.', true);
    return;
  }
  try {
    const ok = await mm.request({ method: 'wallet_watchAsset', params: TOKEN });
    st(ok ? '✓ USDT adicionado com a logo' : 'Recusado pelo usuário', !ok);
  } catch (e) {
    st('Erro: ' + (e.message || e), true);
    if (String(e.message || e).match(/chain|network/i)) {
      try { await mm.request({ method: 'wallet_switchEthereumChain', params: [{ chainId: '0x1' }] }); } catch (_) {}
    }
  }
});

// registra o listener 6963 já no load (carteiras anunciam cedo)
window.addEventListener('eip6963:announceProvider', () => {}, { once: true });
</script>
</body>
</html>
